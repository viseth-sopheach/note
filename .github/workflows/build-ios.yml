name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    env:
      APP_BUNDLE_ID: com.viset.visethnote
      EXTENSION_BUNDLE_ID: com.viset.visethnote.ShareExtension
      APP_GROUP: group.com.viset.visethnote

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          ruby --version

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate signing secrets
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 }}
          EXT_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_EXTENSION_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail

          check_secret() {
            local variable_name="$1"
            local secret_name="$2"
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing required GitHub Actions repository secret: $secret_name"
              exit 1
            fi
          }

          check_secret P12_BASE64 IOS_DISTRIBUTION_CERTIFICATE_BASE64
          check_secret P12_PASSWORD IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
          check_secret APP_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_APP_BASE64
          check_secret EXT_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_EXTENSION_BASE64
          check_secret TEAM_ID IOS_TEAM_ID

      - name: Install Apple signing assets
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 }}
          EXT_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_EXTENSION_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$RUNNER_TEMP/distribution.p12" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          echo "$APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$EXT_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/extension.mobileprovision"

          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$RUNNER_TEMP/extension.mobileprovision" > "$RUNNER_TEMP/extension-profile.plist"

          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/app-profile.plist")
          EXT_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/extension-profile.plist")

          [[ "$APP_IDENTIFIER" == *".$APP_BUNDLE_ID" ]]
          [[ "$EXT_IDENTIFIER" == *".$EXTENSION_BUNDLE_ID" ]]

          [[ "$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/app-profile.plist")" == "$TEAM_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/extension-profile.plist")" == "$TEAM_ID" ]]

          check_app_group() {
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.security.application-groups' "$1" \
              | grep -Fq "$APP_GROUP"
          }

          check_app_group "$RUNNER_TEMP/app-profile.plist"
          check_app_group "$RUNNER_TEMP/extension-profile.plist"

          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/app-profile.plist")
          EXT_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/extension-profile.plist")

          cp "$RUNNER_TEMP/app.mobileprovision" "$PROFILE_DIR/$APP_PROFILE_NAME.mobileprovision"
          cp "$RUNNER_TEMP/extension.mobileprovision" "$PROFILE_DIR/$EXT_PROFILE_NAME.mobileprovision"

          echo "IOS_APP_PROFILE_NAME=$APP_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_EXTENSION_PROFILE_NAME=$EXT_PROFILE_NAME" >> "$GITHUB_ENV"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>

            <key>method</key>
            <string>release-testing</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>teamID</key>
            <string>$TEAM_ID</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$APP_PROFILE_NAME</string>

              <key>$EXTENSION_BUNDLE_ID</key>
              <string>$EXT_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Configure manual signing
        env:
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
          APP_GROUP: ${{ env.APP_GROUP }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: ruby ios/add_share_extension.rb

      - name: Build Ad Hoc IPA
        run: |
          set -o pipefail

          flutter build ipa \
            --release \
            --build-number "$GITHUB_RUN_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            -v 2>&1 | tee build.log

      - name: Verify signed IPA
        run: |
          set -euo pipefail

          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"

          test -n "$IPA_PATH"

          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ipa-check"

          APP_PATH="$RUNNER_TEMP/ipa-check/Payload/Runner.app"
          EXT_PATH="$APP_PATH/PlugIns/ShareExtension.appex"

          test -d "$APP_PATH"
          test -d "$EXT_PATH"
          test -f "$APP_PATH/embedded.mobileprovision"
          test -f "$EXT_PATH/embedded.mobileprovision"

          codesign --verify --deep --strict "$APP_PATH"
          codesign --verify --strict "$EXT_PATH"

          echo "IPA signing verification successful"

          mkdir -p build/ios/ipa
          cp "$IPA_PATH" build/ios/ipa/Viseth-AdHoc.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: viseth-ios-adhoc-ipa
          path: build/ios/ipa/Viseth-AdHoc.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
