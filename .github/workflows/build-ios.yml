name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter --version

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Initialize build log
        run: ': > build.log'

      - name: Install Flutter dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a build.log

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 | tee -a build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload app.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload app.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: app.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
