name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Initialize build log
        run: ': > build.log'

      - name: Install Flutter dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a build.log

      - name: Prepare Share Extension target
        env:
          BUNDLE_ID: com.viset.visethnote
          APP_GROUP: group.com.viset.visethnote
        run: |
          set -o pipefail
          gem install xcodeproj --no-document 2>&1 | tee -a build.log
          ruby ios/add_share_extension.rb 2>&1 | tee -a build.log

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 | tee -a build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          app_path="build/ios/iphoneos/Runner.app"
          ipa_path="build/ios/ipa/Viseth.ipa"
          test -d "$app_path"
          test -d "$app_path/PlugIns/ShareExtension.appex"
          mkdir -p "$(dirname "$ipa_path")"
          rm -f "$ipa_path"
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          mkdir "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/Runner.app"
          (cd "$package_dir" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/$ipa_path")
          unzip -l "$ipa_path" | grep -F 'Payload/Runner.app/PlugIns/ShareExtension.appex/' > /dev/null

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: viseth-ios-ipa
          path: build/ios/ipa/Viseth.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
