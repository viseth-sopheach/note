name: Build iOS IPA (ESign)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_BUNDLE_ID: com.viset.visethnote
      EXTENSION_BUNDLE_ID: com.viset.visethnote.ShareExtension
      APP_GROUP: group.com.viset.visethnote

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          ruby --version

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure iOS project and Share Extension
        env:
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
          APP_GROUP: ${{ env.APP_GROUP }}
        run: |
          gem install xcodeproj --no-document
          ruby -c ios/add_share_extension.rb
          ruby ios/add_share_extension.rb

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-number "$GITHUB_RUN_NUMBER" -v 2>&1 | tee build.log

      - name: Package unsigned IPA for ESign
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH" || { echo "::error::Runner.app not found"; exit 1; }

          rm -rf "$RUNNER_TEMP/ipa" build/ios/ipa
          mkdir -p "$RUNNER_TEMP/ipa/Payload" build/ios/ipa
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Runner.app"

          # ESign signs everything itself: drop stale signatures and metadata.
          find "$RUNNER_TEMP/ipa" -name ".DS_Store" -delete
          find "$RUNNER_TEMP/ipa" -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/ipa" -name "embedded.mobileprovision" -delete

          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/build/ios/ipa/Viseth.ipa" Payload)
          test -s build/ios/ipa/Viseth.ipa
          unzip -l build/ios/ipa/Viseth.ipa | head -n 20

      - name: Validate IPA
        run: |
          set -euo pipefail
          CHECK="$RUNNER_TEMP/check"
          rm -rf "$CHECK" && mkdir -p "$CHECK"
          unzip -q build/ios/ipa/Viseth.ipa -d "$CHECK"
          APP="$CHECK/Payload/Runner.app"
          EXT="$APP/PlugIns/ShareExtension.appex"

          [[ -d "$APP" ]] || { echo "::error::Runner.app missing"; exit 1; }
          plutil -lint "$APP/Info.plist"

          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          [[ "$APP_ID" == "$APP_BUNDLE_ID" ]] || { echo "::error::Bundle ID is $APP_ID"; exit 1; }

          APP_EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          [[ -x "$APP/$APP_EXE" ]] || { echo "::error::Executable $APP_EXE missing"; exit 1; }

          if [[ -d "$EXT" ]]; then
            plutil -lint "$EXT/Info.plist"
            EXT_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Info.plist")
            [[ "$EXT_ID" == "$EXTENSION_BUNDLE_ID" ]] || { echo "::error::Extension ID is $EXT_ID"; exit 1; }
            EXT_EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT/Info.plist")
            [[ -x "$EXT/$EXT_EXE" ]] || { echo "::error::Extension executable missing"; exit 1; }
            echo "Share Extension verified."
          else
            echo "::warning::ShareExtension.appex not found in the IPA."
          fi
          echo "IPA validated: $APP_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viseth-ESign-ipa
          path: build/ios/ipa/Viseth.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
