name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH" || { echo "Runner.app not found"; exit 1; }

          rm -rf Payload Viseth-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/Runner.app

          # Remove any stray signature/metadata files
          find Payload -name ".DS_Store" -delete
          rm -rf Payload/Runner.app/_CodeSignature

          # zip -y keeps symlinks; ditto would also work
          zip -qry Viseth-unsigned.ipa Payload

          unzip -l Viseth-unsigned.ipa | head -n 20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viseth-unsigned-ipa
          path: Viseth-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
