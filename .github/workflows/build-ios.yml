name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout latest repository revision
        uses: actions/checkout@v4

      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      # This app uses receive_sharing_intent and its iOS share extension.
      # Generate the plugin's SPM package before adding the extension target.
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure iOS share extension
        shell: bash
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document
          ruby -c ios/add_share_extension.rb

          # Read the Runner bundle ID from the checked-out Xcode project so
          # the script always configures the app and extension consistently.
          BUNDLE_ID="$(ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            runner = project.targets.find { |target| target.name == "Runner" } or abort "Runner target not found"
            identifiers = runner.build_configurations.map do |configuration|
              configuration.build_settings.fetch("PRODUCT_BUNDLE_IDENTIFIER", "").strip
            end.uniq
            abort "Runner PRODUCT_BUNDLE_IDENTIFIER must be a single, literal bundle ID across configurations" unless
              identifiers.length == 1 && identifiers.first.match?(/\A[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+\z/)
            puts identifiers.first
          ')"
          export BUNDLE_ID
          echo "Configuring Runner bundle ID: $BUNDLE_ID"
          ruby ios/add_share_extension.rb

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_DIR="build/ios/ipa"
          STAGING_DIR="$RUNNER_TEMP/unsigned-ipa"

          test -d "$APP_PATH" || { echo "::error::Runner.app was not generated at $APP_PATH"; exit 1; }
          rm -rf "$IPA_DIR" "$STAGING_DIR"
          mkdir -p "$IPA_DIR" "$STAGING_DIR/Payload"
          cp -R "$APP_PATH" "$STAGING_DIR/Payload/Runner.app"
          (cd "$STAGING_DIR" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/$IPA_DIR/Viseth-UNSIGNED.ipa" Payload)

          test -s "$IPA_DIR/Viseth-UNSIGNED.ipa"
          /usr/bin/unzip -tq "$IPA_DIR/Viseth-UNSIGNED.ipa"
          /usr/bin/unzip -Z1 "$IPA_DIR/Viseth-UNSIGNED.ipa" | grep -Fxq 'Payload/Runner.app/Info.plist'

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viseth-UNSIGNED
          path: build/ios/ipa/Viseth-UNSIGNED.ipa
          if-no-files-found: error
          compression-level: 0
